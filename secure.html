<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EOS Tracker — Company Operating System</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel2:#1d2530; --line:#2a323f;
    --txt:#e6edf3; --muted:#8b97a7; --accent:#4f7cff; --accent2:#6c5ce7;
    --green:#2ecc71; --red:#ff5c5c; --amber:#f5a623; --chip:#222b38;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  a{color:var(--accent)}
  .app{display:flex;min-height:100vh}
  .side{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:17px;padding:6px 10px 14px;letter-spacing:.3px}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:3px}
  .nav{display:block;padding:10px 12px;border-radius:9px;color:var(--muted);cursor:pointer;text-decoration:none;font-weight:600}
  .nav:hover{background:var(--panel2);color:var(--txt)}
  .nav.active{background:var(--accent);color:#fff}
  .nav .c{float:right;background:rgba(255,255,255,.15);border-radius:20px;padding:0 8px;font-size:11px;font-weight:700}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .btn{background:var(--accent);color:#fff;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
  .btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{background:var(--red)}
  .main{flex:1;padding:26px 32px;max-width:1500px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .card .big{font-size:30px;font-weight:700}
  .card .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.green{background:rgba(46,204,113,.15);color:var(--green)}
  .pill.red{background:rgba(255,92,92,.15);color:var(--red)}
  .pill.amber{background:rgba(245,166,35,.15);color:var(--amber)}
  .pill.grey{background:var(--chip);color:var(--muted)}
  .cell-green{color:var(--green);font-weight:700}
  .cell-red{color:var(--red);font-weight:700}
  .bar{height:7px;background:var(--panel2);border-radius:20px;overflow:hidden;min-width:90px}
  .bar > i{display:block;height:100%;background:var(--accent)}
  .muted{color:var(--muted)}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:8px;font-size:13px;width:100%;font-family:inherit}
  input[type=checkbox]{width:auto}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:560px;max-width:100%}
  .modal h2{margin:0 0 16px;font-size:18px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .fgrid .full{grid-column:1/3}
  .ms-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .ms-row input[type=text]{flex:1}
  .sparkline{display:flex;align-items:flex-end;gap:2px;height:34px}
  .sparkline > i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
  .tag{font-size:11px;background:var(--chip);color:var(--muted);padding:2px 8px;border-radius:6px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
  .iconbtn:hover{color:var(--txt)}
  .done-txt{text-decoration:line-through;color:var(--muted)}
  .seg{display:flex;gap:6px}
  .seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">EOS Tracker<small>Company Operating System</small></div>
    <a class="nav" data-view="dashboard">Dashboard</a>
    <a class="nav" data-view="rocks">Rocks <span class="c" id="c-rocks"></span></a>
    <a class="nav" data-view="scorecard">Scorecard <span class="c" id="c-score"></span></a>
    <a class="nav" data-view="kpis">KPIs <span class="c" id="c-kpis"></span></a>
    <a class="nav" data-view="ids">IDS / Issues <span class="c" id="c-ids"></span></a>
    <a class="nav" data-view="todos">To-Dos <span class="c" id="c-todos"></span></a>
    <div class="foot">
      <button class="btn sec sm" onclick="exportData()">Export JSON</button>
      <button class="btn sec sm" onclick="document.getElementById('imp').click()">Import JSON</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(event)"/>
      <button class="btn sec sm" onclick="resetData()">Reset to seed</button>
      <div id="syncstatus" style="margin-top:8px;font-size:11px;font-weight:600;color:#d97706">● Connecting…</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

const KEY = "eos-tracker-v1"; // local cache used as offline fallback only

/* ================= SHARED BACKEND (Supabase) =================
   v2 swaps per-browser localStorage for a shared Postgres store so the
   board sees one live dataset. The in-memory `DB` shape is byte-identical
   to v1 (camelCase), so every CRUD view, export, and import is unchanged.
   Persistence strategy: optimistic in-memory mutate -> background sync that
   upserts every row and deletes rows no longer present (last-writer-wins per
   collection — appropriate for a small board tool). Falls back to localStorage
   if the backend is unreachable. */
const SB_URL = "https://krthbgtykwamxqvapxnx.supabase.co";
const SB_KEY = "sb_publishable_ToA4drk8mWPKiG6RsxRGyA_GC7iXSqf"; // publishable key only identifies the project; ALL data access is gated by per-user Supabase Auth session + RLS (OMN-55)
const COLLECTIONS = ["rocks","scorecard","kpis","issues","todos"];
let sb = null, ONLINE = false;
try { sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }); } catch(e){ sb = null; }

/* column (snake_case) <-> object (camelCase) mappers, faithful to the v1 model */
const MAP = {
  rocks: {
    toRow: o => ({id:o.id,title:o.title,owner:o.owner,type:o.type,quarter:o.quarter,due_date:o.dueDate,status:o.status,percent_complete:o.percentComplete,milestones:o.milestones||[]}),
    toObj: r => ({id:r.id,title:r.title,owner:r.owner,type:r.type,quarter:r.quarter,dueDate:r.due_date,status:r.status,percentComplete:r.percent_complete,milestones:r.milestones||[]})
  },
  scorecard: {
    toRow: o => ({id:o.id,name:o.name,owner:o.owner,goal:o.goal,direction:o.direction,weeks:o.weeks||[]}),
    toObj: r => ({id:r.id,name:r.name,owner:r.owner,goal:r.goal,direction:r.direction,weeks:r.weeks||[]})
  },
  kpis: {
    toRow: o => ({id:o.id,name:o.name,owner:o.owner,target:o.target,current:o.current,unit:o.unit,history:o.history||[]}),
    toObj: r => ({id:r.id,name:r.name,owner:r.owner,target:r.target,current:r.current,unit:r.unit,history:r.history||[]})
  },
  issues: {
    toRow: o => ({id:o.id,title:o.title,description:o.description,owner:o.owner,priority:o.priority,status:o.status,created_at:o.createdAt}),
    toObj: r => ({id:r.id,title:r.title,description:r.description,owner:r.owner,priority:r.priority,status:r.status,createdAt:r.created_at})
  },
  todos: {
    toRow: o => ({id:o.id,title:o.title,owner:o.owner,due_date:o.dueDate,done:!!o.done}),
    toObj: r => ({id:r.id,title:r.title,owner:r.owner,dueDate:r.due_date,done:!!r.done})
  }
};

function setStatus(txt, ok){ const el=document.getElementById("syncstatus"); if(el){ el.textContent=txt; el.style.color = ok?"#16a34a":"#d97706"; } }

function localLoad(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return JSON.parse(JSON.stringify(SEED)); }
function localSave(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

async function cloudLoad(){
  if(!sb) throw new Error("supabase client unavailable");
  const out = {};
  for(const c of COLLECTIONS){
    const { data, error } = await sb.from(c).select("*");
    if(error) throw error;
    out[c] = (data||[]).map(MAP[c].toObj);
  }
  try{ const { data } = await sb.from("people").select("name").order("sort_order"); if(data && data.length) PEOPLE = data.map(p=>p.name); }catch(e){}
  return out;
}

let _syncing=false, _resync=false;
async function cloudSaveAll(){
  if(!sb){ localSave(); return; }
  if(_syncing){ _resync=true; return; }   // coalesce rapid saves
  _syncing=true; setStatus("● Saving…", true);
  try{
    for(const c of COLLECTIONS){
      const rows = DB[c].map(MAP[c].toRow);
      if(rows.length){ const { error } = await sb.from(c).upsert(rows); if(error) throw error; }
      // delete rows removed locally (everything whose id is not in the current set)
      let del = sb.from(c).delete();
      del = rows.length ? del.not("id","in","("+DB[c].map(x=>'"'+String(x.id).replace(/"/g,'')+'"').join(",")+")")
                        : del.neq("id","__never__");
      const { error:e2 } = await del; if(e2) throw e2;
    }
    localSave(); ONLINE=true; setStatus("● Live · shared", true);
  }catch(e){
    ONLINE=false; setStatus("● Offline · saved locally", false); localSave(); console.error("EOS sync failed:", e);
  }finally{
    _syncing=false;
    if(_resync){ _resync=false; cloudSaveAll(); }
  }
}

function save(){ renderCounts(); cloudSaveAll(); }   // optimistic: UI updates now, cloud syncs in background

let DB = JSON.parse(JSON.stringify(SEED)); // safe default until init() loads the shared store
let VIEW = "dashboard";

async function init(){
  setStatus("● Connecting…", true);
  try{ DB = await cloudLoad(); ONLINE=true; setStatus("● Live · shared", true); localSave(); }
  catch(e){ DB = localLoad(); ONLINE=false; setStatus("● Offline · local only", false); console.error("EOS cloud load failed:", e); }
  renderCounts(); go("dashboard");
}

function uid(p){ return p+"-"+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ownerSelect(val){ return `<select name="owner">`+PEOPLE.map(p=>`<option ${p===val?"selected":""}>${esc(p)}</option>`).join("")+`</select>`; }

/* ---------- counts ---------- */
function renderCounts(){
  document.getElementById("c-rocks").textContent = DB.rocks.length;
  document.getElementById("c-score").textContent = DB.scorecard.length;
  document.getElementById("c-kpis").textContent = DB.kpis.length;
  document.getElementById("c-ids").textContent = DB.issues.filter(i=>i.status!=="solved").length;
  document.getElementById("c-todos").textContent = DB.todos.filter(t=>!t.done).length;
}

/* ---------- modal ---------- */
function openModal(html){ const m=document.getElementById("modal"); m.innerHTML=html; document.getElementById("modal-bg").classList.add("show"); }
function closeModal(){ document.getElementById("modal-bg").classList.remove("show"); }
document.getElementById("modal-bg").addEventListener("click",e=>{ if(e.target.id==="modal-bg") closeModal(); });

/* ---------- nav ---------- */
function go(v){ VIEW=v; document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===v)); render(); }
document.querySelectorAll(".nav").forEach(n=>n.addEventListener("click",()=>go(n.dataset.view)));

/* ---------- helpers ---------- */
function rockStatusPill(s){ return s==="done"?'<span class="pill grey">Done</span>': s==="off-track"?'<span class="pill red">Off-track</span>':'<span class="pill green">On-track</span>'; }
function priPill(p){ return p==="high"?'<span class="pill red">High</span>': p==="low"?'<span class="pill grey">Low</span>':'<span class="pill amber">Medium</span>'; }
function idsPill(s){ return s==="solved"?'<span class="pill green">Solved</span>': s==="discussing"?'<span class="pill amber">Discussing</span>':'<span class="pill grey">Open</span>'; }

/* ================= DASHBOARD ================= */

  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
    <div>
      <div class="between"><h3 style="margin:0">Rocks at risk</h3><a class="nav" style="display:inline;padding:4px 8px" onclick="go('rocks')">View all →</a></div>
      <table><thead><tr><th>Rock</th><th>Owner</th><th>Status</th><th class="num">%</th></tr></thead><tbody>
      ${r.filter(x=>x.status!=="done").sort((a,b)=>a.percentComplete-b.percentComplete).slice(0,6).map(x=>`<tr><td>${esc(x.title)}</td><td class="muted">${esc(x.owner)}</td><td>${rockStatusPill(x.status)}</td><td class="num">${x.percentComplete}%</td></tr>`).join("")||'<tr><td colspan=4 class=muted>No rocks</td></tr>'}
      </tbody></table>
    </div>
    <div>
      <div class="between"><h3 style="margin:0">This week's to-dos</h3><a class="nav" style="display:inline;padding:4px 8px" onclick="go('todos')">View all →</a></div>

      ${DB.todos.slice(0,7).map(t=>`<tr><td><input type=checkbox ${t.done?"checked":""} onchange="toggleTodo('${t.id}')"></td><td class="${t.done?'done-txt':''}">${esc(t.title)}</td><td class="muted">${esc(t.owner)}</td><td class="muted">${esc(t.dueDate)}</td></tr>`).join("")||'<tr><td colspan=4 class=muted>No to-dos</td></tr>'}
      </tbody></table>

function editRock(id){
  const r = id?DB.rocks.find(x=>x.id===id):{title:"",owner:"Company",type:"company",quarter:"Q2 2026",dueDate:"",status:"on-track",percentComplete:0,milestones:[]};

    <form onsubmit="saveRock(event,'${id||""}')">
    <div class="fgrid">
      <div class="full"><label>Title</label><input name="title" required value="${esc(r.title)}"></div>
      <div><label>Owner</label>${ownerSelect(r.owner)}</div>
      <div><label>Type</label><select name="type"><option value="company" ${r.type==="company"?"selected":""}>Company</option><option value="individual" ${r.type==="individual"?"selected":""}>Individual</option></select></div>
      <div><label>Quarter</label><input name="quarter" value="${esc(r.quarter)}"></div>
      <div><label>Due date</label><input name="dueDate" type="date" value="${esc(r.dueDate)}"></div>
      <div><label>Status</label><select name="status"><option value="on-track" ${r.status==="on-track"?"selected":""}>On-track</option><option value="off-track" ${r.status==="off-track"?"selected":""}>Off-track</option><option value="done" ${r.status==="done"?"selected":""}>Done</option></select></div>
      <div><label>% complete</label><input name="pct" type="number" min="0" max="100" value="${r.percentComplete}"></div>
      <div class="full"><label>Milestones</label><div id="ms-wrap">${ms}</div><button type="button" class="btn sec sm" onclick="addMs()">+ milestone</button></div>

    </form>`);
}
function msRow(m,i){ return `<div class="ms-row"><input type=checkbox ${m.done?"checked":""}><input type=text value="${esc(m.text)}" placeholder="milestone"><button type=button class="iconbtn" onclick="this.parentNode.remove()">✕</button></div>`; }
function addMs(){ const w=document.getElementById("ms-wrap"); const d=document.createElement("div"); d.innerHTML=msRow({text:"",done:false}); w.appendChild(d.firstChild); }
function saveRock(e,id){ e.preventDefault(); const f=e.target;
  const ms=[...f.querySelectorAll("#ms-wrap .ms-row")].map(r=>({done:r.querySelector("input[type=checkbox]").checked,text:r.querySelector("input[type=text]").value})).filter(m=>m.text.trim());
  const obj={title:f.title.value,owner:f.owner.value,type:f.type.value,quarter:f.quarter.value,dueDate:f.dueDate.value,status:f.status.value,percentComplete:+f.pct.value||0,milestones:ms};
  if(id){ Object.assign(DB.rocks.find(x=>x.id===id),obj); } else { obj.id=uid("rock"); DB.rocks.push(obj); }
  save(); closeModal(); render();
}

/* ================= SCORECARD ================= */
function viewScorecard(){
  const weeks=13;
  const head=Array.from({length:weeks},(_,i)=>`<th class="num">W${i+1}</th>`).join("");
  const rows=DB.scorecard.map(m=>{
    const cells=Array.from({length:weeks},(_,i)=>{ const v=m.weeks[i]; if(v==null) return '<td class="num muted">—</td>'; const ok=m.direction===">="?v>=m.goal:v<=m.goal; return `<td class="num ${ok?'cell-green':'cell-red'}">${v}</td>`;}).join("");
    return `<tr><td><b>${esc(m.name)}</b></td><td class="muted">${esc(m.owner)}</td><td class="num">${m.direction} ${m.goal}</td>${cells}<td><button class="iconbtn" onclick="editMeas('${m.id}')">Edit</button><button class="iconbtn" onclick="delItem('scorecard','${m.id}')">✕</button></td></tr>`;
  }).join("");
  return `<div class="between"><div><h1>Scorecard</h1><p class="sub" style="margin:0">Weekly measurables · 13-week rolling · red/green vs goal</p></div><button class="btn" onclick="editMeas()">+ New Measurable</button></div>
  <div style="overflow:auto"><table><thead><tr><th>Measurable</th><th>Owner</th><th class="num">Goal</th>${head}<th></th></tr></thead><tbody>${rows||'<tr><td colspan=16 class=empty>No measurables yet.</td></tr>'}</tbody></table></div>`;
}
function editMeas(id){
  const m=id?DB.scorecard.find(x=>x.id===id):{name:"",owner:"Company",goal:0,direction:">=",weeks:Array(13).fill(null)};
  const wk=m.weeks.map((v,i)=>`<div><label>W${i+1}</label><input name="w${i}" type="number" step="any" value="${v==null?"":v}"></div>`).join("");
  openModal(`<h2>${id?"Edit":"New"} Measurable</h2><form onsubmit="saveMeas(event,'${id||""}')">
    <div class="fgrid">
      <div class="full"><label>Name</label><input name="name" required value="${esc(m.name)}"></div>
      <div><label>Owner</label>${ownerSelect(m.owner)}</div>
      <div><label>Direction</label><select name="dir"><option ${m.direction===">="?"selected":""}>&gt;=</option><option ${m.direction==="<="?"selected":""}>&lt;=</option></select></div>
      <div><label>Goal</label><input name="goal" type="number" step="any" value="${m.goal}"></div>
    </div>
    <label>13-week actuals</label>
    <div class="fgrid" style="grid-template-columns:repeat(4,1fr)">${wk}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn sec" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div>
  </form>`);
}
function saveMeas(e,id){ e.preventDefault(); const f=e.target;
  const weeks=Array.from({length:13},(_,i)=>{ const v=f["w"+i].value; return v===""?null:+v; });
  const obj={name:f.name.value,owner:f.owner.value,goal:+f.goal.value,direction:f.dir.value.replace("&gt;",">").replace("&lt;","<"),weeks};
  obj.direction = f.dir.value.indexOf("<")>=0?"<=":">=";
  if(id){ Object.assign(DB.scorecard.find(x=>x.id===id),obj);} else { obj.id=uid("meas"); DB.scorecard.push(obj);} save(); closeModal(); render();
}

/* ================= KPIs ================= */
function viewKPIs(){
  const cards=DB.kpis.map(k=>{
    const hist=k.history||[]; const vals=hist.map(h=>h.value); const max=Math.max(...vals,k.target,1); const min=Math.min(...vals,0);
    const spark=hist.map(h=>`<i title="${esc(h.date)}: ${h.value}" style="height:${max>min?((h.value-min)/(max-min)*100):50}%"></i>`).join("");
    const ok=k.current>=k.target; const last=vals[vals.length-1], prev=vals[vals.length-2];
    const trend = prev==null?"":last>prev?"▲":last<prev?"▼":"�—";
    return `<div class="card">
      <div class="between" style="margin-bottom:6px"><h3 style="margin:0">${esc(k.name)}</h3><span>${trend}</span></div>
      <div class="big">${esc(k.current)}<span class="muted" style="font-size:14px"> ${esc(k.unit||"")}</span></div>
      <div class="meta">Target ${esc(k.target)} ${k.unit||""} · <span class="${ok?'cell-green':'cell-red'}">${ok?"on target":"below target"}</span> · ${esc(k.owner)}</div>
      <div class="sparkline" style="margin-top:12px">${spark||'<span class=muted>no history</span>'}</div>
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="iconbtn" onclick="editKpi('${k.id}')">Edit</button><button class="iconbtn" onclick="delItem('kpis','${k.id}')">✕</button></div>
    </div>`;
  }).join("");
  return `<div class="between"><div><h1>KPIs</h1><p class="sub" style="margin:0">Key metrics with target, current value &amp; trend</p></div><button class="btn" onclick="editKpi()">+ New KPI</button></div>
  <div class="grid cards">${cards||'<div class="empty">No KPIs yet.</div>'}</div>`;
}
function editKpi(id){
  const k=id?DB.kpis.find(x=>x.id===id):{name:"",owner:"Company",target:0,current:0,unit:"",history:[]};
  const hist=(k.history||[]).map(h=>`${h.date}:${h.value}`).join("\n");
  openModal(`<h2>${id?"Edit":"New"} KPI</h2><form onsubmit="saveKpi(event,'${id||""}')">
    <div class="fgrid">
      <div class="full"><label>Name</label><input name="name" required value="${esc(k.name)}"></div>
      <div><label>Owner</label>${ownerSelect(k.owner)}</div>
      <div><label>Unit</label><input name="unit" value="${esc(k.unit)}"></div>
      <div><label>Target</label><input name="target" type="number" step="any" value="${k.target}"></div>
      <div><label>Current</label><input name="current" type="number" step="any" value="${k.current}"></div>
      <div class="full"><label>History (one per line: date:value)</label><textarea name="hist" rows="4">${esc(hist)}</textarea></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn sec" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div>
  </form>`);
}
function saveKpi(e,id){ e.preventDefault(); const f=e.target;
  const history=f.hist.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [d,v]=l.split(":");return{date:(d||"").trim(),value:+(""+v).trim()||0};});
  const obj={name:f.name.value,owner:f.owner.value,unit:f.unit.value,target:+f.target.value||0,current:+f.current.value||0,history};
  if(id){ Object.assign(DB.kpis.find(x=>x.id===id),obj);} else { obj.id=uid("kpi"); DB.kpis.push(obj);} save(); closeModal(); render();
}

/* ---------- shared ---------- */
function delItem(coll,id){ if(!confirm("Delete this item?")) return; DB[coll]=DB[coll].filter(x=>x.id!==id); save(); render(); }
function exportData(){ const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="eos-data.json"; a.click(); }
function importData(e){ const fr=new FileReader(); fr.onload=()=>{ try{ DB=JSON.parse(fr.result); save(); render(); alert("Imported."); }catch(err){ alert("Invalid JSON"); } }; fr.readAsText(e.target.files[0]); }
function resetData(){ if(!confirm("Reset all data to the seeded company structure?")) return; DB=JSON.parse(JSON.stringify(SEED)); save(); render(); }

/* ---------- render ---------- */
function render(){
  const m=document.getElementById("main");
  m.innerHTML = VIEW==="dashboard"?viewDashboard(): VIEW==="rocks"?viewRocks(): VIEW==="scorecard"?viewScorecard(): VIEW==="kpis"?viewKPIs(): VIEW==="ids"?viewIDS(): viewTodos();
}

/* ---------- board access gate: per-user Supabase Auth (OMN-55) ----------
   Replaces the v1 client-side shared access code. Access is now a real,
   revocable, per-user identity: the user signs in, supabase-js holds the
   session JWT (role=authenticated) and attaches it to every PostgREST call,
   and RLS only admits authenticated sessions. The publishable key alone
   (anon) cannot read or write any board data once anon policies are dropped. */
let _gateEl = null;
function _gateError(msg){ const e=document.getElementById("gateErr"); if(e){ e.textContent=msg; e.style.display=msg?"block":"none"; } }
function _showGate(){
  if(_gateEl) return;
  const o=document.createElement("div");o.id="gate";_gateEl=o;
  o.style.cssText="position:fixed;inset:0;z-index:99999;background:#0f1419;display:flex;align-items:center;justify-content:center";
  o.innerHTML='<form id="gateForm" style="background:#171d26;border:1px solid #2a323f;border-radius:14px;padding:34px 32px;width:330px;box-shadow:0 18px 50px rgba(0,0,0,.45);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#e6edf3">'+
  '<h1 style="font-size:18px;margin:0 0 4px">EOS Tracker</h1>'+
  '<p style="color:#8b97a7;font-size:13px;margin:0 0 22px">Company Operating System &middot; board sign-in</p>'+
  '<p id="gateErr" style="color:#ff5c5c;margin:0 0 14px;display:none"></p>'+
  '<label style="display:block;font-size:12px;color:#8b97a7;margin:0 0 6px">Work email</label>'+
  '<input id="gateEmail" type="email" autocomplete="username" autofocus placeholder="you@company.com" style="width:100%;box-sizing:border-box;background:#0f1419;border:1px solid #2a323f;border-radius:8px;color:#e6edf3;padding:11px 12px;font-size:15px">'+
  '<label style="display:block;font-size:12px;color:#8b97a7;margin:14px 0 6px">Password</label>'+
  '<input id="gatePw" type="password" autocomplete="current-password" placeholder="••••••••" style="width:100%;box-sizing:border-box;background:#0f1419;border:1px solid #2a323f;border-radius:8px;color:#e6edf3;padding:11px 12px;font-size:15px">'+
  '<button id="gateBtn" type="submit" style="width:100%;margin-top:16px;background:#4f7cff;border:0;border-radius:8px;color:#fff;padding:11px;font-size:15px;font-weight:600;cursor:pointer">Sign in</button>'+
  '<p style="color:#5b6573;font-size:11px;text-align:center;margin:18px 0 0">Authorized board members only &middot; access is per-user and revocable</p></form>';
  document.body.appendChild(o);
  document.getElementById("gateForm").addEventListener("submit",async(e)=>{
    e.preventDefault();
    if(!sb){ _gateError("Auth service unavailable. Try again shortly."); return; }
    const email=document.getElementById("gateEmail").value.trim().toLowerCase();
    const password=document.getElementById("gatePw").value;
    const btn=document.getElementById("gateBtn");
    if(!email||!password){ _gateError("Enter your email and password."); return; }
    btn.disabled=true; btn.textContent="Signing in…"; _gateError("");
    try{
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ _gateError(error.message||"Sign-in failed."); btn.disabled=false; btn.textContent="Sign in"; return; }
      // success: onAuthStateChange -> _onSignedIn() removes the gate and boots the app
    }catch(err){ _gateError("Sign-in failed. Check your connection."); btn.disabled=false; btn.textContent="Sign in"; }
  });
}
function _hideGate(){ if(_gateEl){ _gateEl.remove(); _gateEl=null; } }
function _mountSignOut(email){
  if(document.getElementById("signoutBar")) { const s=document.getElementById("signoutWho"); if(s) s.textContent=email||""; return; }
  const b=document.createElement("div"); b.id="signoutBar";
  b.style.cssText="position:fixed;top:10px;right:14px;z-index:9000;display:flex;gap:10px;align-items:center;font:12px system-ui,-apple-system,Segoe UI,sans-serif;color:#8b97a7";
  b.innerHTML='<span id="signoutWho">'+esc(email||"")+'</span>'+
    '<button id="signoutBtn" style="background:#171d26;border:1px solid #2a323f;border-radius:7px;color:#e6edf3;padding:6px 11px;font-size:12px;cursor:pointer">Sign out</button>';
  document.body.appendChild(b);
  document.getElementById("signoutBtn").addEventListener("click",async()=>{ try{ await sb.auth.signOut(); }catch(e){} });
}
let _booted=false;
async function _onSignedIn(session){
  _hideGate();
  _mountSignOut(session&&session.user&&session.user.email);
  if(!_booted){ _booted=true; await init(); }
}
function _onSignedOut(){
  _booted=false;
  const bar=document.getElementById("signoutBar"); if(bar) bar.remove();
  // hard reload clears in-memory board data so a signed-out user retains nothing
  location.reload();
}
(async function _bootAuth(){
  if(!sb){ _showGate(); _gateError("Auth service unavailable."); return; }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==="SIGNED_OUT"){ _onSignedOut(); return; }        // only an explicit sign-out tears down
    if(session) _onSignedIn(session);                           // SIGNED_IN / TOKEN_REFRESHED / INITIAL_SESSION(+session)
    else if(event==="INITIAL_SESSION") _showGate();             // cold load, no session -> show login (no reload)
  });
  const { data } = await sb.auth.getSession();
  if(data && data.session) _onSignedIn(data.session); else _showGate();
})();

</script>
